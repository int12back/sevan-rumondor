
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi - Camilan Lokal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header"></header>

  <main class="container">
    <section class="auth-layout">
      <article class="card">
        <h1>Registrasi Pelanggan</h1>
        <p class="muted">Buat akun untuk memesan camilan lokal.</p>

        <form id="register-form">
          <div class="form-group">
            <label for="name">Nama lengkap <span class="required">*</span></label>
            <input type="text" id="name" name="name"
              placeholder="Nama lengkap" required>
            <span class="field-error" id="name-error"></span>
          </div>

          <div class="form-group">
            <label for="email">Email <span class="required">*</span></label>
            <input type="email" id="email" name="email"
              placeholder="nama@email.com" required>
            <span class="field-error" id="email-error"></span>
          </div>

          <div class="form-group">
            <label for="phone">Nomor telepon <span class="required">*</span></label>
            <input type="tel" id="phone" name="phone"
              placeholder="08xxxxxxxxxx" required>
            <span class="field-error" id="phone-error"></span>
          </div>

          <div class="form-group">
            <label for="password">Kata sandi <span class="required">*</span></label>
            <input type="password" id="password" name="password"
              minlength="6" placeholder="Minimal 6 karakter" required>
            <span class="field-error" id="password-error"></span>
          </div>

          <div class="form-group">
            <label for="confirm-password">
              Konfirmasi kata sandi <span class="required">*</span>
            </label>
            <input type="password" id="confirm-password"
              name="confirm-password" minlength="6"
              placeholder="Ulangi kata sandi" required>
            <span class="field-error" id="confirm-error"></span>
          </div>

          <div id="register-error" class="field-error"></div>

          <button type="submit" class="btn btn-block">
            Daftar
          </button>
        </form>

        <hr>

        <p>
          Sudah memiliki akun?
          <a href="login.html">Login</a>
        </p>
      </article>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>

  <script>
    document.getElementById("register-form").addEventListener("submit",
      async function(event) {
        event.preventDefault();

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const phone = document.getElementById("phone").value;
        const password = document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirm-password").value;

        const errorBox = document.getElementById("register-error");

        errorBox.textContent = "";

        document.querySelectorAll(".field-error").forEach(element => {
          if (element.id !== "register-error") {
            element.textContent = "";
          }
        });

        if (password !== confirmPassword) {
          document.getElementById("confirm-error").textContent =
            "Konfirmasi kata sandi tidak sama.";
          return;
        }

        try {
          await initDB();

          await registerUser({
            name,
            email,
            phone,
            password
          });

          showToast("Registrasi berhasil.");

          window.location.href = "login.html";
        } catch (error) {
          errorBox.textContent = error.message;
        }
      });
  </script>
</body>
</html>
