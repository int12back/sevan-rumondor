
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Kurir - Camilan Lokal</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .courier-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .courier-header {
            margin-bottom: 30px;
        }

        .courier-header h1 {
            margin-bottom: 10px;
        }

        .courier-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .courier-stat {
            background: white;
            padding: 24px;
            border-radius: 18px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
            transition: 0.3s;
        }

        .courier-stat:hover {
            transform: translateY(-5px);
        }

        .courier-stat h3 {
            color: #777;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .courier-stat p {
            color: #0d9488;
            font-size: 28px;
            font-weight: bold;
        }

        .courier-list {
            display: grid;
            gap: 20px;
        }

        .courier-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 18px;
            padding: 24px;
            transition: 0.3s;
            animation: courierEnter 0.4s ease;
        }

        .courier-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
        }

        @keyframes courierEnter {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .courier-card-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .courier-card-header p {
            color: #777;
            font-size: 14px;
            margin-top: 5px;
        }

        .courier-products {
            padding: 15px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .courier-product-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 8px 0;
        }

        .courier-total {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-top: 18px;
        }

        .courier-info {
            margin-top: 20px;
            padding: 18px;
            background: #f9fafb;
            border-radius: 14px;
        }

        .courier-info p {
            margin: 8px 0;
            font-size: 14px;
        }

        .courier-controls {
            margin-top: 20px;
        }

        .courier-controls label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .courier-controls select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: white;
        }

        .courier-save-btn {
            width: 100%;
            margin-top: 15px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #0d9488;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .courier-save-btn:hover {
            background: #0f766e;
        }

        .courier-save-btn:active {
            transform: scale(0.97);
        }

        .courier-empty {
            background: white;
            padding: 50px 20px;
            border-radius: 18px;
            text-align: center;
            color: #777;
        }

        @media(max-width:600px) {
            .courier-container {
                padding: 12px;
            }

            .courier-card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="courier-container">

        <header class="courier-header">
            <h1>Panel Kurir</h1>
            <p>Kelola pesanan dan pembaruan status pengiriman.</p>
        </header>

        <section class="courier-summary">

            <div class="courier-stat">
                <h3>Pesanan Siap Dikirim</h3>
                <p id="courierReady">0</p>
            </div>

            <div class="courier-stat">
                <h3>Sedang Dikirim</h3>
                <p id="courierShipping">0</p>
            </div>

            <div class="courier-stat">
                <h3>Selesai</h3>
                <p id="courierCompleted">0</p>
            </div>

        </section>

        <section class="courier-list" id="courierList"></section>

    </main>

    <script src="js/courier.js"></script>

</body>
</html>
