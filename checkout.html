
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Camilan Lokal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header"></header>

  <main class="container">

    <section>
      <h1>Checkout</h1>
      <p class="muted">Periksa pesanan dan alamat pengiriman.</p>

      <article class="card">
        <h2>Data Pelanggan</h2>
        <div id="customer-info"></div>
      </article>
    </section>

    <section class="card">
      <h2>Ringkasan Pesanan</h2>
      <div id="checkout-summary"></div>
    </section>

    <section class="card">
      <h2>Alamat Pengiriman</h2>

      <form id="checkout-form">
        <div class="form-group">
          <label for="shipping-address">
            Alamat lengkap <span class="required">*</span>
          </label>

          <textarea id="shipping-address" name="shipping-address"
            rows="4" placeholder="Masukkan alamat pengiriman lengkap..."
            required></textarea>
        </div>

        <div class="form-group">
          <label>Metode pembayaran</label>
          <input type="text" value="Transfer Bank" readonly>
        </div>

        <div class="info-box">
          <h3>Transfer Bank (Simulasi)</h3>
          <p>Bank BCA</p>
          <p>Nomor rekening: 1234567890</p>
          <p>Nama rekening: UMKM Camilan Lokal</p>
          <p class="small">
            Pembayaran dilakukan melalui transfer manual.
            Tidak ada payment gateway.
          </p>
        </div>

        <div id="checkout-error" class="field-error"></div>

        <button type="submit" class="btn btn-block">
          Konfirmasi Pesanan
        </button>
      </form>

      <div id="checkout-result"></div>
    </section>

  </main>

  <footer class="site-footer"></footer>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/order.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await initDB();

      const session = getSession();

      if (!session || session.role !== "pelanggan") {
        showToast("Silakan login sebagai pelanggan.", "error");
        window.location.href = "login.html";
        return;
      }

      const customer = getById("customer", session.id);

      document.getElementById("customer-info").innerHTML = `
        <p><strong>Nama:</strong> ${escapeHTML(customer?.name || "-")}</p>
        <p><strong>Email:</strong> ${escapeHTML(customer?.email || "-")}</p>
        <p><strong>Telepon:</strong> ${escapeHTML(customer?.phone || "-")}</p>
      `;

      renderCheckout();

      document.getElementById("checkout-form")
        .addEventListener("submit", handleCheckout);
    });
  </script>
  <script src="js/order-bridge.js"></script>

</body>
</html>
