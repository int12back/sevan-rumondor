
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Pesanan - Camilan Lokal</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .admin-orders-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        .admin-header {
            margin-bottom: 30px;
        }

        .admin-header h1 {
            margin-bottom: 8px;
        }

        .admin-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .admin-stat {
            padding: 24px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
            transition: 0.3s;
        }

        .admin-stat:hover {
            transform: translateY(-4px);
        }

        .admin-stat h3 {
            font-size: 14px;
            color: #777;
            margin-bottom: 12px;
        }

        .admin-stat p {
            font-size: 28px;
            color: #0d9488;
            font-weight: bold;
        }

        .admin-orders-list {
            display: grid;
            gap: 20px;
        }

        .admin-order-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            transition: 0.3s;
        }

        .admin-order-card:hover {
            transform: translateY(-3px);
        }

        .admin-order-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .admin-order-top h3 {
            margin-bottom: 6px;
        }

        .admin-order-top p {
            color: #777;
            font-size: 14px;
        }

        .admin-order-products {
            padding: 15px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .admin-product-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 8px 0;
        }

        .admin-total {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 18px;
            padding: 18px 0;
        }

        .admin-payment-info {
            background: #f9fafb;
            padding: 18px;
            border-radius: 14px;
            margin-top: 15px;
        }

        .admin-payment-info p {
            margin: 8px 0;
            font-size: 14px;
        }

        .admin-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .admin-controls label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .admin-controls select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: white;
        }

        .admin-save-btn {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #0d9488;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-save-btn:hover {
            background: #0f766e;
        }

        .admin-empty {
            text-align: center;
            padding: 50px 20px;
            color: #777;
            background: white;
            border-radius: 18px;
        }

        .proof-preview {
            margin-top: 12px;
            word-break: break-word;
        }

        .proof-preview a {
            color: #0d9488;
        }

        @media(max-width:600px) {
            .admin-orders-container {
                padding: 12px;
            }

            .admin-order-card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="admin-orders-container">

        <header class="admin-header">
            <h1>Kelola Pesanan</h1>
            <p>Kelola pembayaran dan perkembangan pesanan pelanggan.</p>
        </header>

        <section class="admin-summary">

            <div class="admin-stat">
                <h3>Total Pesanan</h3>
                <p id="adminTotal">0</p>
            </div>

            <div class="admin-stat">
                <h3>Menunggu Pembayaran</h3>
                <p id="adminPending">0</p>
            </div>

            <div class="admin-stat">
                <h3>Sudah Dibayar</h3>
                <p id="adminPaid">0</p>
            </div>

        </section>

        <section class="admin-orders-list" id="adminOrdersList"></section>

    </main>

    <script src="js/admin-orders.js"></script>

</body>
</html>
