
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesanan Saya - Camilan Lokal</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .orders-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .orders-header {
            margin-bottom: 30px;
        }

        .orders-header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .orders-header p {
            color: #777;
        }

        .orders-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            padding: 24px;
            border-radius: 18px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
            transition: 0.3s;
        }

        .summary-card:hover {
            transform: translateY(-5px);
        }

        .summary-card h3 {
            font-size: 15px;
            color: #777;
            margin-bottom: 12px;
        }

        .summary-card p {
            font-size: 28px;
            font-weight: bold;
            color: #0d9488;
        }

        .orders-section {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
        }

        .order-card {
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            transition: 0.3s;
        }

        .order-card:hover {
            border-color: #0d9488;
            transform: translateY(-3px);
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .order-id {
            font-weight: bold;
        }

        .order-date {
            color: #777;
            font-size: 14px;
            margin-top: 5px;
        }

        .status {
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        .status.pending {
            background: #fff3cd;
            color: #856404;
        }

        .status.paid {
            background: #d1fae5;
            color: #065f46;
        }

        .status.processing {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status.completed {
            background: #e5e7eb;
            color: #374151;
        }

        .order-products {
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 15px 0;
            margin: 15px 0;
        }

        .order-product {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 8px 0;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 18px;
        }

        .payment-box {
            margin-top: 20px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 14px;
        }

        .payment-box h3 {
            margin-bottom: 12px;
        }

        .payment-box p {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .payment-box input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px dashed #ccc;
            border-radius: 10px;
            background: white;
            margin: 10px 0;
        }

        .payment-btn {
            background: #0d9488;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .payment-btn:hover {
            background: #0f766e;
        }

        .payment-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .payment-info {
            margin-top: 12px;
            color: #0d9488;
            font-size: 14px;
        }

        .empty-orders {
            text-align: center;
            padding: 50px 20px;
            color: #777;
        }

        .empty-orders h3 {
            margin-bottom: 10px;
        }

        .payment-proof {
            color: #0d9488;
            margin-top: 10px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .orders-container {
                padding: 12px;
            }

            .orders-section {
                padding: 15px;
            }

            .order-card {
                padding: 15px;
            }

            .orders-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="orders-container">

        <header class="orders-header">
            <h1>Pesanan Saya</h1>
            <p>Kelola pembayaran dan lihat riwayat pesanan Anda.</p>
        </header>

        <section class="orders-summary">
            <div class="summary-card">
                <h3>Total Pesanan</h3>
                <p id="totalOrders">0</p>
            </div>

            <div class="summary-card">
                <h3>Menunggu Pembayaran</h3>
                <p id="pendingOrders">0</p>
            </div>

            <div class="summary-card">
                <h3>Pesanan Selesai</h3>
                <p id="completedOrders">0</p>
            </div>
        </section>

        <section class="orders-section">
            <h2>Riwayat Pesanan</h2>
            <div id="ordersList"></div>
        </section>

    </main>

    <script src="js/db.js"></script>
    <script src="js/payment.js"></script>

</body>
</html>
