
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Produk - Camilan Lokal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header"></header>

  <main class="container">
    <section id="product-detail"></section>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cart.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await initDB();

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const product = id ? getById("product", id) : null;
      const container = document.getElementById("product-detail");

      if (!product) {
        container.innerHTML = `
          <div class="empty-state">
            <h2>Produk tidak ditemukan</h2>
            <a href="index.html" class="btn">Kembali</a>
          </div>
        `;
        return;
      }

      const category = getById("category", product.category_id);

      container.innerHTML = `
        <article class="card">
          <div class="product-grid">
            <div>
              <img src="${product.photo || placeholderImage()}"
                alt="${escapeHTML(product.product_name)}"
                style="width:100%;height:300px;object-fit:cover"
                onerror="this.src=placeholderImage()">
            </div>

            <div>
              <h1>${escapeHTML(product.product_name)}</h1>

              <p class="muted">
                Kategori:
                ${escapeHTML(category?.category_name || "-")}
              </p>

              <p class="price">${formatRupiah(product.price)}</p>

              <p>${escapeHTML(product.description)}</p>

              <p>
                ${product.stock > 0
                  ? `<span class="badge badge-success">
                      Tersedia (${product.stock})
                    </span>`
                  : `<span class="badge badge-danger">
                      Habis (0)
                    </span>`
                }
              </p>

              <div class="form-group">
                <label for="quantity">Jumlah</label>
                <input type="number" id="quantity"
                  min="1" max="${product.stock}" value="1"
                  ${product.stock <= 0 ? "disabled" : ""}>
              </div>

              <button class="btn btn-block"
                id="add-product"
                ${product.stock <= 0 ? "disabled" : ""}>
                Tambah ke Keranjang
              </button>

              <p>
                <a href="index.html">Kembali ke katalog</a>
              </p>
            </div>
          </div>
        </article>
      `;

      document.getElementById("add-product")
        .addEventListener("click", () => {
          try {
            const quantity = Number(
              document.getElementById("quantity").value
            );

            if (!Number.isInteger(quantity) || quantity < 1) {
              throw new Error("Jumlah minimal 1.");
            }

            addToCart(product.product_id, quantity);
          } catch (error) {
            showToast(error.message, "error");
          }
        });
    });
  </script>

</body>
</html>
